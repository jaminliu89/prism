name: Foundry regression

on:
  pull_request:
    paths:
      - 'scripts/foundry.py'
      - 'scripts/foundry_guard.py'
      - 'scripts/foundry_panel.py'
      - 'tests/test_foundry.py'
      - 'tests/test_foundry_guards.py'
      - 'tests/test_foundry_panel.py'
      - '.github/workflows/foundry-regression.yml'
  push:
    branches:
      - 'feat/product-foundry-v0-1-20261027'
      - 'feat/foundry-planning-review-v02'

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Existing Prism and Product Foundry tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify original method snapshots
        run: python3 scripts/prism.py doctor
