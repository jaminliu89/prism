name: Packet Evidence Router
on:
  pull_request:
    paths:
      - 'scripts/packet_evidence_router.py'
      - 'tests/test_packet_evidence_router.py'
      - 'docs/NETWORK_PACKET_EVIDENCE_ROUTING.md'
      - 'SKILL.md'
      - '.github/workflows/packet-evidence-router.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/packet_evidence_router.py'
      - 'tests/test_packet_evidence_router.py'
      - 'docs/NETWORK_PACKET_EVIDENCE_ROUTING.md'
      - 'SKILL.md'
      - '.github/workflows/packet-evidence-router.yml'
jobs:
  packet-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -p 'test_packet_evidence_router.py' -v
      - run: python3 scripts/prism.py doctor
